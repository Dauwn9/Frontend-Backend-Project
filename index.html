<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Главная страница</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
    h1 { text-align: center; padding: 20px; color: #333; }
    .cards {
      display: flex; gap: 20px; justify-content: center;
      margin: 40px auto; flex-wrap: wrap;
      max-width: 1000px;
    }
    .card {
      background: white; border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      width: 250px; overflow: hidden;
      transition: transform 0.2s ease;
    }
    .card:hover { transform: translateY(-5px); }
    .card img {
      width: 100%; height: 150px; object-fit: cover;
    }
    .card-content {
      padding: 15px; text-align: center;
    }
    .card-content a {
      text-decoration: none; color: #007BFF;
      font-weight: bold; font-size: 18px;
    }
    .card-content a:hover { color: #0056b3; }
  </style>
</head>
<body>
  <h1>Навигация по страницам</h1>
  <div class="cards">
    <div class="card">
      <img src="images/resume.jpg" alt="Резюме">
      <div class="card-content">
        <a href="page1.html">Моё резюме</a>
      </div>
    </div>
    <div class="card">
      <img src="images/page2.jpg" alt="Страница 2">
      <div class="card-content">
        <a href="page2.html">Страница 2</a>
      </div>
    </div>
    <div class="card">
      <img src="images/page3.jpg" alt="Страница 3">
      <div class="card-content">
        <a href="page3.html">Страница 3</a>
      </div>
    </div>
  </div>
</body>
</html>
